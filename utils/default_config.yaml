# ----- Data -----
data:
  repo_id: "TornikeO/era5-5.625deg"
  local_dir: "./dataset/era5_data"
  data_paths: [
    "./dataset/era5_data/geopotential_500/*.nc",
    "./dataset/era5_data/temperature_850/*.nc",
    "./dataset/era5_data/2m_temperature/*.nc",
    "./dataset/era5_data/10m_u_component_of_wind/*.nc",
    "./dataset/era5_data/10m_v_component_of_wind/*.nc",
  ]
  levels: ["z", "t", "t2m", "u10", "v10"]        
  time:
    train_start: "2005-01-01"
    train_end:   "2014-12-31"
    val_start:   "2015-01-01"
    val_end:     "2016-12-31"
    test_start:  "2017-01-01"
    test_end:    "2018-12-31"
  sample_rate: "daily"        # daily or hourly

# ----- Training -----
training:
  batch_size: 32
  num_workers: 4
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1e-5

# ----- Spatio-Temporal Graph -----
graph:
  input_length: 7
  forecast_horizon: 1
  neighborhood: 4            # 4 or 8
  type: "strong"             # strong or cartesian

# ----- Model -----
model:
  type: "graph"             
  hidden_dim: 64
  num_layers: 3
  dropout: 0.2

# ----- Logging -----
logging:
  log_dir: "runs/"
  checkpoint_dir: "checkpoints/"